<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SambasKu Mobile - Prototipe Statis (docs/UI.md)</title>
<style>
  /* == Zinc palette, Forui-like == */
  :root{
    --bg:#fafafa; --surface:#ffffff; --surface2:#f4f4f5;
    --border:#e4e4e7; --border2:#d4d4d8;
    --fg:#18181b; --fg2:#52525b; --fg3:#a1a1aa;
    --accent:#18181b; --accent-fg:#fafafa;
    --success:#16a34a; --success-bg:#f0fdf4; --success-fg:#15803d;
    --warning:#d97706; --warning-bg:#fffbeb; --warning-fg:#b45309;
    --danger:#dc2626; --danger-bg:#fef2f2;
    --skeleton:#e4e4e7;
  }
  .screen.dark{
    --bg:#09090b; --surface:#18181b; --surface2:#27272a;
    --border:#27272a; --border2:#3f3f46;
    --fg:#fafafa; --fg2:#a1a1aa; --fg3:#52525b;
    --accent:#fafafa; --accent-fg:#18181b;
    --success-bg:#052e16; --success-fg:#4ade80;
    --warning-bg:#451a03; --warning-fg:#fbbf24;
    --danger-bg:#450a0a;
    --skeleton:#27272a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{
    background:#f4f4f5; color:#18181b;
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
    padding:32px 24px 64px;
  }
  .board-head{max-width:1480px;margin:0 auto 28px}
  .board-head h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .board-head p{font-size:13px;color:#52525b;margin-top:4px}
  .board-head code{font-size:12px;background:#e4e4e7;padding:2px 6px;border-radius:4px}
  .board{display:flex;flex-wrap:wrap;gap:36px;justify-content:center;max-width:1560px;margin:0 auto}

  /* == Phone frame == */
  .unit{display:flex;flex-direction:column;align-items:center;gap:10px}
  .unit figcaption{font-size:12px;color:#52525b;font-weight:600}
  .unit figcaption span{color:#a1a1aa;font-weight:400}
  .phone{
    width:390px;height:812px;background:#09090b;border-radius:48px;padding:10px;
    box-shadow:0 24px 48px -12px rgba(0,0,0,.25), 0 0 0 1px #27272a;
    flex-shrink:0;
  }
  .screen{
    width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--bg);
    display:flex;flex-direction:column;position:relative;color:var(--fg);
  }
  .statusbar{
    height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:14px 26px 0;font-size:14px;font-weight:600;
  }
  .island{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:118px;height:32px;background:#09090b;border-radius:20px;z-index:50;
  }
  .scroll{flex:1;overflow-y:auto;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}

  /* == FHeader == */
  .fheader{
    display:flex;align-items:center;gap:8px;padding:6px 16px;min-height:48px;flex-shrink:0;
  }
  .fheader .htitle{font-size:20px;font-weight:700;letter-spacing:-.02em;flex:1}
  .fheader.sub .htitle{font-size:17px}
  .iconbtn{
    width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:var(--fg);flex-shrink:0;border:none;background:transparent;cursor:pointer;
  }
  .iconbtn:active{background:var(--surface2)}

  /* == Body == */
  .body{padding:0 16px;display:flex;flex-direction:column;gap:14px}
  .sect{display:flex;flex-direction:column;gap:8px}
  .sect-h{display:flex;align-items:baseline;justify-content:space-between}
  .sect-h b{font-size:14px;font-weight:700;letter-spacing:-.01em}
  .sect-h a{font-size:12px;color:var(--fg2);text-decoration:none;font-weight:500}

  .searchbar{
    display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:10px;
    padding:0 12px;height:38px;color:var(--fg3);font-size:14px;
  }

  /* Kata hari ini */
  .today{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;
    display:flex;flex-direction:column;gap:6px;
  }
  .today .lbl{font-size:11px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.06em}
  .lemma-row{display:flex;align-items:center;gap:10px}
  .lemma{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .gloss{font-size:14px;color:var(--fg2);line-height:1.45}
  .meta-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

  .badge{
    font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;
    display:inline-flex;align-items:center;gap:4px;line-height:1.5;white-space:nowrap;
  }
  .badge.ok{background:var(--success-bg);color:var(--success-fg)}
  .badge.warn{background:var(--warning-bg);color:var(--warning-fg)}
  .badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
  .chip{
    font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;
    border:1px solid var(--border2);color:var(--fg2);background:var(--surface);
    white-space:nowrap;cursor:pointer;
  }
  .chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .chip.sel{border-color:var(--fg);color:var(--fg)}

  /* Compact list / FTile */
  .tgroup{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;
  }
  .tile{
    display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:52px;
  }
  .tile + .tile{border-top:1px solid var(--border)}
  .tile .tmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .tile .tt{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
  .tile .ts{font-size:12.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .sfx{color:var(--fg3);flex-shrink:0;display:flex;align-items:center;gap:10px}
  .tile .lead{color:var(--fg2);flex-shrink:0}
  .count{font-size:12px;color:var(--fg3);font-weight:500}

  /* Bottom nav */
  .bnav{
    flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);
    display:flex;padding:6px 8px 22px;
  }
  .bnav a{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    text-decoration:none;color:var(--fg3);font-size:10px;font-weight:600;padding-top:6px;
  }
  .bnav a.on{color:var(--fg)}

  /* Detail */
  .detail-top{padding:4px 16px 0;display:flex;flex-direction:column;gap:8px}
  .note{
    font-size:12.5px;color:var(--warning-fg);background:var(--warning-bg);
    border-radius:10px;padding:10px 12px;line-height:1.5;
  }
  .block{display:flex;flex-direction:column;gap:6px}
  .block .bh{font-size:12px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
  .block .bd{font-size:15px;line-height:1.55}
  .example{
    background:var(--surface2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;
  }
  .example .sbs{font-size:14.5px;font-weight:600;line-height:1.5}
  .example .id{font-size:13px;color:var(--fg2);line-height:1.5}
  .audio-row{
    display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:8px 12px;font-size:13px;color:var(--fg2);
  }

  /* Form */
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:13px;font-weight:600}
  .field input,.field textarea{
    background:var(--surface);border:1px solid var(--border2);border-radius:10px;
    padding:10px 12px;font-size:14px;font-family:inherit;color:var(--fg);outline:none;
  }
  .field input::placeholder,.field textarea::placeholder{color:var(--fg3)}
  .field input:focus,.field textarea:focus{border-color:var(--fg2)}
  .field.err input{border-color:var(--danger)}
  .field .msg{font-size:11.5px;color:var(--danger)}
  .field .hint{font-size:11.5px;color:var(--fg3)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .thumbs{display:flex;gap:8px}
  .thumb{
    width:64px;height:64px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--fg3);
    font-size:10px;flex-direction:column;gap:2px;
  }
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;
    font-size:15px;font-weight:600;border:none;cursor:pointer;width:100%;
  }
  .btn.primary{background:var(--accent);color:var(--accent-fg)}
  .btn.ghost{background:var(--surface2);color:var(--fg)}

  /* Skeleton */
  .sk{background:var(--skeleton);border-radius:8px;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  /* misc */
  .intro{font-size:13.5px;color:var(--fg2);line-height:1.5;padding:0 2px}
  .stat-line{
    display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg2);
    background:var(--surface2);border-radius:10px;padding:10px 12px;line-height:1.45;
  }
  .identity{display:flex;align-items:center;gap:12px;padding:2px 2px 0}
  .avatar{
    width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-fg);
    display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;flex-shrink:0;
  }
  .idmain{display:flex;flex-direction:column;gap:2px;min-width:0}
  .idmain .n{font-size:16px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .idmain .u{font-size:12.5px;color:var(--fg3)}
  .role{
    font-size:10.5px;font-weight:600;color:var(--fg2);border:1px solid var(--border2);
    padding:1px 8px;border-radius:999px;white-space:nowrap;
  }
  .guestbox{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:14px;display:flex;flex-direction:column;gap:10px;
  }
  .guestbox p{font-size:13.5px;color:var(--fg2);line-height:1.5}
</style>
</head>
<body>

<header class="board-head">
  <h1>SambasKu Mobile - Prototipe statis</h1>
  <p>Sumber spek: <code>docs/UI.md</code> - Forui-like, Zinc, list compact, 4 tab shell. Buka tiap frame lalu scroll isinya. Data kata dari csv repo.</p>
</header>
