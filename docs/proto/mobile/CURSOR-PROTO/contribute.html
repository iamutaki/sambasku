<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Usulkan kata - SambasKu Proto</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage">
    <div class="stage-bar">
      <a class="back-link" href="index.html">← Galeri</a>
      <span class="label">contribute.html · form tamu</span>
    </div>
    <div class="phone">
      <div class="status-bar"><span>9:41</span><span class="icons">▌▌▌ ☁︎ 🔋</span></div>
      <div class="app">
        <header class="header">
          <button class="icon-btn" aria-label="Kembali" onclick="location.href='activity.html'">
            <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="title sm">Usulkan kata</div>
          <div class="header-actions"></div>
        </header>
        <div class="body">
          <div class="guest-hint">
            Dikirim sebagai tamu. Kata belum tayang. Tim akan memeriksanya dulu.
          </div>

          <div class="field">
            <label>Lemma (Sambas)</label>
            <input type="text" value="belangin" readonly />
          </div>

          <div class="field">
            <label>Arti / glos (Indonesia)</label>
            <textarea readonly>bersih-bersih; membersihkan rumah atau halaman sebelum acara</textarea>
          </div>

          <div class="field">
            <label>Jenis kata</label>
            <div class="chips">
              <span class="chip">nomina</span>
              <span class="chip on">verba</span>
              <span class="chip">adjektiva</span>
              <span class="chip">adverbia</span>
              <span class="chip">lainnya</span>
            </div>
          </div>

          <div class="field">
            <label>Contoh kalimat (opsional)</label>
            <textarea readonly>Kami belangin rumah sebelum kenduri.</textarea>
          </div>

          <div class="field">
            <label>Gambar (opsional)</label>
            <div class="attach-row">
              <div class="attach filled" title="Thumbnail"></div>
              <div class="attach">+</div>
            </div>
            <div class="hint">Maks. beberapa gambar. Kamera atau galeri.</div>
          </div>

          <button class="btn primary mt-8" type="button">Kirim</button>
          <button class="btn ghost mt-8" type="button" onclick="location.href='activity.html'">Batal</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
