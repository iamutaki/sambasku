<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - SambasKu Proto</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage">
    <div class="stage-bar">
      <a class="back-link" href="index.html">← Galeri</a>
      <span class="label">login.html · auth</span>
    </div>
    <div class="phone">
      <div class="status-bar"><span>9:41</span><span class="icons">▌▌▌ ☁︎ 🔋</span></div>
      <div class="app">
        <header class="header">
          <button class="icon-btn" aria-label="Kembali" onclick="location.href='profile-guest.html'">
            <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="title sm">Masuk</div>
          <div class="header-actions"></div>
        </header>
        <div class="auth-body body">
          <div class="brand">SambasKu</div>
          <div class="sub">Masuk untuk bookmark, vote, dan usul sebagai diri sendiri. Cari kata tetap boleh sebagai tamu.</div>

          <div class="oauth">
            <button class="btn secondary" type="button">Lanjut dengan Google</button>
            <button class="btn secondary" type="button">Lanjut dengan Facebook</button>
          </div>

          <div class="or">atau</div>

          <div class="field">
            <label>Email</label>
            <input type="email" placeholder="nama@contoh.com" />
          </div>
          <div class="field">
            <label>Sandi</label>
            <input type="password" placeholder="••••••••" value="password" readonly />
          </div>

          <button class="btn primary" type="button" onclick="location.href='profile.html'">Masuk</button>

          <div class="link-row">
            Lupa sandi? · Belum punya akun? <a href="#">Daftar</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
